<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemex DZ — Specialty coffee</title>
  <meta name="description" content="Chemex DZ — specialty coffee, pour-over brewing and coffee equipment in Algeria.">
  <meta name="theme-color" content="#3A2418">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Chemex DZ">
  <meta property="og:description" content="Specialty coffee, pour-over brewing and coffee equipment.">
  <link rel="icon" href="/assets/img/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="top">
    <div class="nav__inner container">
      <a class="brand" href="#top" aria-label="Home">
        <img src="/assets/img/mark.svg" alt="" width="36" height="36">
        <span class="brand__name" data-bind="brand_name">Chemex DZ</span>
      </a>
      <nav class="nav__links" id="nav-links" aria-label="Main">
        <a href="#story">Story</a>
        <a href="#selection">Selection</a>
        <a href="#why">Why us</a>
        <a href="#contact">Contact</a>
      </nav>
      <a class="btn btn--primary btn--sm nav__cta" href="#contact">Visit us</a>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- Hero -->
    <section class="hero">
      <div class="container hero__grid">
        <div class="hero__copy">
          <p class="eyebrow" data-bind="hero_eyebrow"></p>
          <h1 class="hero__title" data-bind="hero_title"></h1>
          <p class="hero__lead" data-bind="hero_subtitle"></p>
          <div class="hero__actions">
            <a class="btn btn--primary" href="#selection" data-bind="hero_cta">Explore the selection</a>
            <a class="btn btn--ghost" href="#contact">Find us</a>
          </div>
        </div>
        <div class="hero__visual">
          <div class="arch arch--hero" data-image="hero_image">
            <svg class="arch__art" viewBox="0 0 200 260" aria-hidden="true">
              <path d="M40 30h120L112 112v12l54 92c4 7-1 14-9 14H43c-8 0-13-7-9-14l54-92v-12Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
              <rect x="74" y="104" width="52" height="28" rx="8" fill="#B87945"/>
              <path d="M58 196h84" stroke="#B87945" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M100 8v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/>
            </svg>
          </div>
          <div class="hero__badge">
            <span class="hero__badge-dot" aria-hidden="true"></span>
            <span data-bind="tagline"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- About -->
    <section class="section story" id="story">
      <div class="container story__grid">
        <div class="story__media reveal">
          <div class="arch arch--story" data-image="about_image">
            <svg class="arch__art" viewBox="0 0 200 200" aria-hidden="true">
              <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="2.5"/>
              <path d="M100 52c-22 22-22 74 0 96" fill="none" stroke="#B87945" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="story__copy reveal">
          <p class="eyebrow"><span class="eyebrow__num">01</span> Our story</p>
          <h2 class="h2" data-bind="about_title"></h2>
          <div class="prose" data-bind-paragraphs="about_text"></div>
        </div>
      </div>
    </section>

    <!-- Featured -->
    <section class="section featured" id="featured" hidden>
      <div class="container">
        <div class="section__head reveal">
          <p class="eyebrow eyebrow--light"><span class="eyebrow__num">02</span> Signature</p>
          <h2 class="h2" data-bind="featured_title"></h2>
        </div>
        <div class="featured__track" id="featured-list" role="list"></div>
      </div>
    </section>

    <!-- Products -->
    <section class="section selection" id="selection">
      <div class="container">
        <div class="section__head section__head--split reveal">
          <div>
            <p class="eyebrow"><span class="eyebrow__num">03</span> The selection</p>
            <h2 class="h2" data-bind="products_title"></h2>
          </div>
          <p class="section__intro" data-bind="products_intro"></p>
        </div>
        <div class="filters" id="filters" role="tablist" aria-label="Categories"></div>
        <div id="catalogue" aria-live="polite">
          <div class="grid">
            <div class="card card--skeleton"></div>
            <div class="card card--skeleton"></div>
            <div class="card card--skeleton"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Why -->
    <section class="section why" id="why">
      <div class="container">
        <div class="section__head reveal">
          <p class="eyebrow"><span class="eyebrow__num">04</span> The difference</p>
          <h2 class="h2" data-bind="why_title"></h2>
        </div>
        <ol class="why__list" id="highlights"></ol>
      </div>
    </section>

    <!-- Contact -->
    <section class="section contact" id="contact">
      <div class="container contact__grid">
        <div class="contact__intro reveal">
          <p class="eyebrow"><span class="eyebrow__num">05</span> Contact</p>
          <h2 class="h2" data-bind="contact_title"></h2>
          <div class="contact__actions">
            <a class="btn btn--primary" id="contact-call" hidden>Call us</a>
            <a class="btn btn--ghost" id="contact-map" target="_blank" rel="noopener" hidden>Get directions</a>
          </div>
        </div>
        <dl class="contact__list reveal" id="contact-list"></dl>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__grid">
      <div>
        <a class="brand brand--light" href="#top">
          <img src="/assets/img/mark.svg" alt="" width="32" height="32">
          <span class="brand__name" data-bind="brand_name">Chemex DZ</span>
        </a>
        <p class="footer__note" data-bind="footer_note"></p>
      </div>
      <nav class="footer__links" aria-label="Footer">
        <a href="#story">Story</a>
        <a href="#selection">Selection</a>
        <a href="#contact">Contact</a>
        <a id="footer-instagram" target="_blank" rel="noopener" hidden>Instagram</a>
      </nav>
    </div>
    <div class="container footer__base">
      <span>© <span id="year"></span> <span data-bind="brand_name">Chemex DZ</span>. All rights reserved.</span>
    </div>
  </footer>

  <dialog class="modal" id="product-modal" aria-labelledby="modal-title">
    <div class="modal__inner">
      <button class="modal__close" type="button" aria-label="Close" data-close>&times;</button>
      <div class="modal__media" id="modal-media"></div>
      <div class="modal__body">
        <p class="modal__cat" id="modal-cat"></p>
        <h3 class="modal__title" id="modal-title"></h3>
        <p class="modal__unit" id="modal-unit"></p>
        <p class="modal__desc" id="modal-desc"></p>
        <p class="modal__price" id="modal-price"></p>
      </div>
    </div>
  </dialog>
</body>
</html>
